name: Berlin sky

on:
  schedule:
    - cron: "*/30 * * * *"   # sky: every 30 minutes
    - cron: "17 3 * * *"     # quotes: once a day, early morning
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [sky, quotes]
        default: sky

permissions:
  contents: write

concurrency:
  group: bear-sky
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 3 * * *" ]; then
            echo "job=quotes" >> "$GITHUB_OUTPUT"
          else
            echo "job=sky" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        run: python sky/sky.py ${{ steps.pick.outputs.job }}
        env:
          BEAR_API_KEY: ${{ secrets.BEAR_API_KEY }}
          BEAR_SUBDOMAIN: delilerdensenanlarsin

      # GitHub pauses scheduled runs in repos with no commits for 60 days.
      - name: Keep the schedule alive
        if: steps.pick.outputs.job == 'quotes'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the schedule alive"
            git push
          fi
