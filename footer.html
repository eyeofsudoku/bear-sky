<div class="sky-badge" aria-label="Berlin"><div class="clock"></div><div class="temp"></div><div class="city">Berlin</div></div>
<script>
(function () {
  // Time of day from Berlin's clock and sun, so the sky is right even between script runs
  var root = document.documentElement;
  function berlinSky(now) {
    var parts = {};
    new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZoneName: 'shortOffset' })
      .formatToParts(now).forEach(function (p) { parts[p.type] = p.value; });
    var h = +parts.hour + +parts.minute / 60;
    var off = parseFloat(String(parts.timeZoneName || '').replace('GMT', '')) || 1;
    var n = Math.floor((now - Date.UTC(now.getUTCFullYear(), 0, 0)) / 864e5);
    var lat = 52.52 * Math.PI / 180;
    var decl = 23.44 * Math.PI / 180 * Math.sin(2 * Math.PI * (284 + n) / 365);
    var ha = Math.acos(-Math.tan(lat) * Math.tan(decl)) * 180 / Math.PI;
    var noon = 12 + off - 13.405 / 15, rise = noon - ha / 15, set = noon + ha / 15;
    if (h < rise - 0.5 || h > set + 0.75) return 'night';
    if (h < rise + 1) return 'dawn';
    if (h > set - 1) return 'dusk';
    return 'day';
  }
  function applySky() {
    var t = berlinSky(new Date());
    ['dawn', 'day', 'dusk', 'night'].forEach(function (x) { root.classList.toggle('sky-' + x, x === t); });
    root.classList.add('sky-js');
  }

  // Berlin clock
  var c = document.querySelector('.sky-badge .clock');
  function tick() {
    applySky();
    if (c) c.textContent = new Intl.DateTimeFormat('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit' }).format(new Date());
  }
  tick();
  setInterval(tick, 15000);

  // Big quote (home page only): random quotable post -> random line from it.
  // The list of quotable posts comes from the theme (--sky-posts), written by the GitHub script.
  var main = document.querySelector('body.home main');
  var raw = getComputedStyle(document.documentElement).getPropertyValue('--sky-posts').trim().replace(/^["']|["']$/g, '');
  var posts = raw ? raw.split(/\s+/) : [];
  if (!main || !posts.length) return;
  var box = document.createElement('div');
  box.className = 'sky-quote sky-loading';
  box.innerHTML = '<p class="big-quote"></p><p class="big-quote-source"><a href="#">yazının tamamı →</a></p>';
  main.appendChild(box);
  var q = box.querySelector('.big-quote');
  var s = box.querySelector('.big-quote-source a');
  var done = false;
  function show() { if (!done) { done = true; box.classList.remove('sky-loading'); } }
  function fail() { if (!done) { done = true; box.remove(); } }
  setTimeout(fail, 4000); // nothing found in time: show no quote rather than an empty one

  function size(t) {
    q.classList.toggle('is-long', t.length > 90 && t.length <= 150);
    q.classList.toggle('is-xlong', t.length > 150);
  }

  function linesOf(doc) {
    var m = doc.querySelector('main');
    if (!m) return [];
    [].forEach.call(m.querySelectorAll('time'), function (t) { var p = t.closest('p'); if (p) p.remove(); });
    [].forEach.call(m.querySelectorAll('h1, .tags, form, script, style, blockquote, pre, code, .sky-quote'), function (e) { e.remove(); });
    var parts = [];
    [].forEach.call(m.querySelectorAll('p, li'), function (el) {
      var cl = el.cloneNode(true);
      [].forEach.call(cl.querySelectorAll('br'), function (b) { b.replaceWith('\n'); });
      cl.textContent.split('\n').forEach(function (l) {
        l = l.replace(/\s+/g, ' ').trim();
        if (l) parts.push(l);
      });
    });
    if (!parts.length) return [];
    var short = parts.filter(function (l) { return l.length < 80; }).length;
    var pieces = [];
    if (short / parts.length >= 0.7) {
      pieces = parts; // poem: line by line
    } else {
      parts.forEach(function (l) { pieces = pieces.concat(l.match(/[^.!?…]+[.!?…]*/g) || []); });
    }
    return pieces.map(function (p) { return p.replace(/^[\s\-–—"'“”«»]+|[\s\-–—"'“”«»]+$/g, ''); })
      .filter(function (p) { return p.length >= 12 && p.length <= 160 && p.split(' ').length >= 3; });
  }

  function attempt(n) {
    if (!n) return fail();
    var url = posts[Math.floor(Math.random() * posts.length)];
    fetch(url, { credentials: 'same-origin' })
      .then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (h) {
        var L = linesOf(new DOMParser().parseFromString(h, 'text/html'));
        if (!L.length) return attempt(n - 1);
        var t = L[Math.floor(Math.random() * L.length)];
        if (done) return;
        q.textContent = t; size(t); s.href = url;
        show();
      })
      .catch(function () { attempt(n - 1); });
  }
  attempt(3);
})();
</script>
